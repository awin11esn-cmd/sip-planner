name: Refresh fund NAVs

on:
  schedule:
    - cron: "45 18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update NAVs in index.html
        run: python scripts/update_nav.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "nav-bot"
          git config user.email "nav-bot@users.noreply.github.com"
          git commit -am "NAV refresh $(TZ=Asia/Kolkata date +%F)"
          git push
